@let news = item();
<!-- Named by the title only: the rest would make a long link name. -->
<a
  class="group focus-visible:outline-al-primary block h-full rounded-lg focus-visible:outline-2 focus-visible:outline-offset-2"
  [attr.aria-label]="news.title"
  [routerLink]="link() | alLocalize"
  queryParamsHandling="preserve"
>
  <article
    class="bg-al-card dark:border-al-border md:group-hover:shadow-al-primary flex h-full w-full flex-col gap-2 rounded-lg border p-4 transition-shadow"
  >
    <div class="flex items-baseline justify-between gap-3 text-sm">
      <span
        data-testid="news-card-category"
        class="text-al-primary font-semibold dark:text-[#ff4d94]"
      >
        {{ 'aiNewsPage.categories.' + news.category | transloco }}
      </span>
      <time
        class="shrink-0 whitespace-nowrap text-gray-600 dark:text-gray-400"
        [attr.datetime]="news.publishedAt"
        [title]="absoluteDate()"
      >
        {{ dateText() }}
      </time>
    </div>
    <h3
      class="text-al-primary-foreground text-lg/snug font-bold"
      style="word-break: break-word"
    >
      {{ news.title }}
    </h3>
    <p class="text-sm/relaxed">{{ news.excerpt }}</p>

    <al-news-source
      data-testid="news-card-meta"
      class="mt-auto pt-3 text-sm text-gray-600 dark:text-gray-400"
      [item]="news"
    />
  </article>
</a>
